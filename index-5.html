const N=["Zar Ni Win", "Su Su San", "Hein Htet Aung", "Wai Lwin Aung", "Thiha Thu", "Sai Htet Zaw", "Han Win Htoo", "Phuu Akari Zaw", "Phyu Sin Thwel", "Aung Pyae Phyo", "Kyay Mhone Htoo", "Han Htoo Sett", "Ye Thiha Aung", "Aung Kaung Pyae Phyo", "Myo Min Htike"], R={"2026-10-06": ["OFF", "OFF", "E", "E", "M", "OFF", "M", "E", "M", "OFF", "M", "M", "M", "E", "E"], "2026-10-07": ["M", "M", "E", "E-Off", "M", "E-Off", "M", "M", "OFF", "E", "M", "E", "E", "OFF", "E"], "2026-10-08": ["E", "M", "OFF", "E", "M", "E", "M", "OFF", "E", "E-Off", "M", "E", "M", "M", "E"], "2026-10-09": ["E", "M", "E", "E", "OFF", "E", "M", "E-Off", "E", "E", "M", "E", "M", "M", "OFF"], "2026-10-10": ["OFF", "M", "E", "E", "M", "E", "M", "E", "E", "E", "E", "M", "OFF", "E-Off", "E"], "2026-10-11": ["M", "E", "M", "E", "M", "E", "M", "M", "M", "M", "OFF", "OFF", "M", "M", "E"], "2026-10-12": ["E", "M", "E-Off", "OFF", "E", "OFF", "OFF", "E", "M", "M", "E", "M", "E", "M", "M"], "2026-10-13": ["M", "OFF", "E", "M", "E", "E", "E", "M", "E", "OFF", "E", "M", "E", "M", "M"], "2026-10-14": ["OFF", "E", "M", "M", "E", "E", "E-Off", "OFF", "OFF", "E", "E", "E", "E", "OFF", "M"], "2026-10-15": ["M", "E", "OFF", "M", "E", "E", "E", "OFF", "M", "M", "E", "M", "E-Off", "E", "M"]}; let f="all";
const $=x=>document.getElementById(x);
function fmt(d){let [y,m,dd]=d.split("-");return dd+"."+m+"."+y}
for(const d of Object.keys(R)){let o=document.createElement("option");o.value=d;o.textContent=fmt(d);$("date").append(o)}
function groups(){let g={M:[],E:[],OFF:[],X:[]};N.forEach((n,i)=>{let c=R[$("date").value][i];if(c==="M")g.M.push(n);else if(c==="E")g.E.push(n);else if(c==="OFF")g.OFF.push(n);else g.X.push(n)});return g}
function out(){let g=groups(),p=g.M.length+g.E.length;return fmt($("date").value)+"\n\nXtraSure Waizayantar\n\nAttendance List\n\nMorning Shift\n-----------------\n"+g.M.join("\n")+"\n\nEvening Shift\n----------------\n"+g.E.join("\n")+"\n\n\nTotal Men Power - "+p+"\n\nOFF Day & Leave\n----------------------\n"+g.OFF.map(n=>"Off Day - "+n).join("\n")+(g.OFF.length&&g.X.length?"\n":"")+g.X.map(n=>"Extra Off - "+n).join("\n")}
function render(){let g=groups(),p=g.M.length+g.E.length;$("m").textContent=g.M.length;$("e").textContent=g.E.length;$("p").textContent=p;$("mc").textContent=g.M.length+" People";$("ec").textContent=g.E.length+" People";$("oc").textContent=g.OFF.length+g.X.length;$("morning").innerHTML=g.M.map(n=>"<span>"+n+"</span>").join("");$("evening").innerHTML=g.E.map(n=>"<span>"+n+"</span>").join("");$("off").innerHTML=[...g.OFF.map(n=>'<div class="offitem"><b>OFF DAY</b>'+n+"</div>"),...g.X.map(n=>'<div class="offitem"><b>EXTRA OFF</b>'+n+"</div>")].join("");$("morningCard").classList.toggle("hide",f==="evening"||f==="off");$("eveningCard").classList.toggle("hide",f==="morning"||f==="off");$("offCard").classList.toggle("hide",f==="morning"||f==="evening");$("box").textContent=out()}
function filter(x){f=x;document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.f===x));render()}
async function copy(){try{await navigator.clipboard.writeText($("box").textContent);toast("Copied ✓")}catch(e){let t=document.createElement("textarea");t.value=$("box").textContent;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();toast("Copied ✓")}}
function mode(){document.body.classList.toggle("light");localStorage.xmode=document.body.classList.contains("light")?"light":"dark";$("mode").textContent=document.body.classList.contains("light")?"🌙 Dark":"☀️ Light"}
function toast(x){$("toast").textContent=x;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1000)}
if(localStorage.xmode==="light")document.body.classList.add("light");$("mode").textContent=document.body.classList.contains("light")?"🌙 Dark":"☀️ Light";render();
</script></body></html>
